<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>Calculadora</title>
</head>
<body class="bg-dark text-white">
  <div class="container mt-4">
    <div class="row justify-content-center">
      
      <div class="col-2 text-center" style="background-color: rgb(71, 67, 67);">
        <img src="img.jpg" alt="" height="150" width="100%">
      </div>

      <div class="col-4 text-center" style="background-color: rgb(56, 50, 50); padding: 15px;">
            <label>
            <p>Ingresa el Valor 1</p>
            <input type="text" id="num1">
            <p class="mt-2">Ingresa el Valor 2</p>
            <input type="text" id="num2">
            </label>
            <br>
            <select class="btn btn-secondary dropdown-toggle"  onchange="calcularResultado(this.value)">
              <option value="0">Ingresa una opción</option>
              <option value="1">Suma</option>
              <option value="2">Resta</option>
              <option value="3">Multiplicación</option>
              <option value="4">División V1/V2</option>
              <option value="5">Potencia V1^V2</option>
            </select>
            <div id="Opcion"></div>
      </div>
      <div class="col-2 text-center" style="background-color: rgb(39, 35, 35);">
         <img src="img2.jpg" alt="" height="150" width="100%">
      </div>

    </div>
  </div>

  <script src="Calculadora.js"></script>
</body>
</html>
