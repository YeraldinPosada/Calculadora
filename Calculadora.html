<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>
    <label for="">
        <p>Ingresa el Valor 1</p>
        <input type="text" name="" id="num1">
        <br>
        <p>Ingresa el Valor 2</p>
        <input type="text" name="" id="num2">
        <br>
    </label>
    <label for="">Elige una opción:</label>
    <select  onchange="calcularResultado(this.value)" name="" id="">
        <br>
        <option value="1" name="opcion" id="1">Suma</option>
        <option value="2" name="opcion" id="2">Resta</option>
        <option value="3" name="opcion" id="3">Multiplicación</option>
        <option value="4" name="opcion" id="4">División V1/V2</option>
        <option value="5" name="opcion" id="5">Potencia V1^V2</option>
        <script src="Calculadora.js"></script>

    </select>
</body>
</html>
